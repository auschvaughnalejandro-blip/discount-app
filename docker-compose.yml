services:
  db:
    image: postgres:15-alpine
    container_name: pgp-db
    restart: unless-stopped
    environment:
      # Schema owner. Migrations run as this role.
      POSTGRES_USER: pgp_owner
      # Local development only. This file is never used in production —
      # docker-compose.prod.yml is, and it requires every secret to be supplied
      # with no default. Keeping the two apart is what stops a committed
      # development password becoming a production one.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgp_local_dev}
      POSTGRES_DB: pgp
      # The application role, created by docker/postgres/init/01-app-role.sh.
      # It is deliberately not the owner, so the REVOKE that enforces R7 bites.
      PGP_APP_PASSWORD: ${PGP_APP_PASSWORD:-pgp_local_app}
    ports:
      - "5433:5432"
    volumes:
      - pgp-db-data:/var/lib/postgresql/data
      # Runs once, on first initialisation of an empty data volume.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgp_owner -d pgp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgp-db-data:
